# Cloud Build 設定ファイル（個人テスト環境）
steps:
  # 1. pnpmのインストール
  - name: "node:20"
    entrypoint: "bash"
    args: ["-c", "npm install -g pnpm && pnpm --version"]

  # 2. 依存関係のインストール
  - name: "node:20"
    entrypoint: "bash"
    args: ["-c", "npm install -g pnpm && pnpm install --frozen-lockfile"]

  # 3. Next.js プロジェクトのビルド
  - name: "node:20"
    entrypoint: "bash"
    args: ["-c", "npm install -g pnpm && pnpm build"]

# ビルドオプション
options:
  logging: CLOUD_LOGGING_ONLY

# タイムアウト設定（10分）
timeout: 600s
